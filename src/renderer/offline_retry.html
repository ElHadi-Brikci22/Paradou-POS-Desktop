<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARADOU POS - Connexion au Serveur</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a 70%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(99, 102, 241, 0.3);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: #4f46e5;
      border-radius: 20px;
      font-weight: 900;
      font-size: 32px;
      color: white;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.5);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    p.sub {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      margin-bottom: 24px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
      margin-bottom: 12px;
    }
    .btn-primary:hover { background: #4338ca; transform: translateY(-1px); }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      margin-bottom: 12px;
    }
    .btn-secondary:hover { background: #334155; color: white; }
    .btn-emergency {
      background: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    .btn-emergency:hover { background: rgba(245, 158, 11, 0.2); }
    .config-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(51, 65, 85, 0.5);
      text-align: left;
    }
    .config-box label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .config-input-group {
      display: flex;
      gap: 8px;
    }
    .config-input {
      flex: 1;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
    }
    .config-input:focus { border-color: #6366f1; }
    .btn-save {
      width: auto;
      padding: 10px 16px;
      background: #334155;
      color: white;
      font-size: 13px;
      border-radius: 10px;
    }
    .btn-save:hover { background: #475569; }
    .timer-text {
      font-size: 12px;
      color: #64748b;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">P</div>
    <h1>PARADOU POS DESKTOP</h1>
    <p class="sub">Tentative de connexion à l'application principale...</p>

    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="status-text">Serveur injoignable</span>
    </div>

    <button class="btn btn-primary" id="retry-btn" onclick="retryNow()">
      <span>🔄</span> Réessayer la connexion (<span id="countdown">4</span>s)
    </button>

    <button class="btn btn-emergency" onclick="openEmergencyMode()">
      <span>⚡</span> Mode Secours Hors-Ligne Autonome
    </button>

    <div class="config-box">
      <label for="server-url-input">Adresse du Serveur (Local ou Cloud)</label>
      <div class="config-input-group">
        <input type="text" id="server-url-input" class="config-input" value="http://127.0.0.1:8000" placeholder="http://127.0.0.1:8000">
        <button class="btn btn-save" onclick="saveAndConnect()">Enregistrer</button>
      </div>
      <div class="timer-text" id="target-info">Cible actuelle : http://127.0.0.1:8000</div>
    </div>
  </div>

  <script>
    let countdown = 4;
    let timer = null;

    async function init() {
      if (window.posDesktop && window.posDesktop.getConfig) {
        const cfg = await window.posDesktop.getConfig();
        if (cfg && cfg.serverUrl) {
          document.getElementById('server-url-input').value = cfg.serverUrl;
          document.getElementById('target-info').textContent = 'Cible actuelle : ' + cfg.serverUrl;
        }
      }
      startCountdown();
    }

    function startCountdown() {
      countdown = 4;
      document.getElementById('countdown').textContent = countdown;
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        countdown--;
        document.getElementById('countdown').textContent = countdown;
        if (countdown <= 0) {
          clearInterval(timer);
          retryNow();
        }
      }, 1000);
    }

    async function retryNow() {
      document.getElementById('status-text').textContent = 'Connexion en cours...';
      if (window.posDesktop && window.posDesktop.retryConnection) {
        const res = await window.posDesktop.retryConnection();
        if (!res || !res.success) {
          document.getElementById('status-text').textContent = 'Serveur injoignable';
          startCountdown();
        }
      } else {
        window.location.reload();
      }
    }

    async function saveAndConnect() {
      const newUrl = document.getElementById('server-url-input').value.trim();
      if (!newUrl) return;
      if (window.posDesktop && window.posDesktop.saveConfig) {
        const cfg = await window.posDesktop.getConfig() || {};
        cfg.serverUrl = newUrl;
        await window.posDesktop.saveConfig(cfg);
      }
      retryNow();
    }

    function openEmergencyMode() {
      if (window.posDesktop && window.posDesktop.openEmergencyUI) {
        window.posDesktop.openEmergencyUI();
      } else {
        window.location.href = 'index.html';
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
